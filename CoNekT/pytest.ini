[pytest]
# Test discovery settings
testpaths = tests

# Collect only from testpaths
collect_ignore_glob = 
    */lib/*
    */site-packages/*
    */bin/*
    */venv/*
    */virtualenv/*

# Test file discovery pattern
python_files = test_*.py *_test.py

# Test class discovery pattern
python_classes = Test* *Test

# Test function discovery pattern
python_functions = test_*

# Custom markers
markers =
    unit: Fast unit tests
    integration: Integration tests between components
    slow: Slow tests that take more time
    db: Tests that require database access
    admin: Tests for administrative functionalities
    website: Tests for website routes and views
    blast: Tests related to BLAST (require configuration)
    login_required: Tests that require login enabled
    te: Tests related to Transposable Elements (TEs)
    tedistill: Tests related to TEdistills
    te_class: Tests related to TEClasses
    expression: Tests for gene expression
    network: Tests for coexpression networks
    families: Tests for gene families
    ontology: Tests for ontologies (GO, InterPro, etc)
    phylogeny: Tests for phylogenetic trees and clades

# Default command line options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Files/directories to ignore
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    bin
    lib
    migrations
    docs
    site-packages
    .pytest_cache
    htmlcov
    venv
    virtualenv
    .venv
    env
    **/lib/**
    **/bin/**
    **/site-packages/**

# Ignore conftest.py from external packages - limit conftest search
confcutdir = tests

# Coverage settings
[coverage:run]
source = CoNekT/conekt
omit = 
    */tests/*
    */migrations/*
    */bin/*
    */lib/*
    */docs/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
